; Wizardry 8 Widescreen settings. Lives next to Wiz8.exe.
; Read at start-up; the values actually used are written to wiz8wide.log next to the exe.
; Display mode, resolution and view distance are easier to change in the game: Options - Video.
[Canvas]
; Width of the 2D canvas: auto | 640 | 768 | 856
;   auto: from the output proportions in 3DVideo.CFG (lines 2-3):
;         >= 1.70 (16:9 and wider) -> 856, >= 1.55 (16:10) -> 768, otherwise 640.
;   640 = as the original. Other numbers are rounded up to a multiple of 8 (854 -> 856).
Width=auto
; 1 = the 3D world extends to the canvas edges in view modes 0, 1, 6 (Hor+).
HorPlus=1
; 1 = screen pixels are converted to canvas pixels (needed when the output,
;     e.g. 2560x1600, is larger than the W x 480 canvas). 0 = as the original (1:1).
; Without the key: 1 when W > 640, 0 when W = 640 (then W = 640 behaves exactly like the
; original). Uncomment to set it explicitly.
;MouseScale=1
; 1 = automap uses the whole canvas width: more of the map is visible, buttons at the right edge.
; 0 = 640-wide map in the centre, stone on the sides.
WideAutomap=1
; 1 = interface windows (options, saves, journal) fill the screen. 0 = 640-wide window in the centre, stone on the sides.
WideWindows=1

[Display]
; Display mode (also in the game: Options - Video, page 2; applied at once, a change of the
; screen proportions needs a restart):
;   borderless (default) - borderless window over the whole monitor at its own resolution;
;   fullscreen - full screen at ScreenWidth x ScreenHeight; the monitor keeps its own mode
;               and the picture is scaled to it, with black bars if the proportions differ;
;   window     - framed window with a ScreenWidth x ScreenHeight client area.
; Videos are drawn through the 2D canvas in every mode (no switch to 640x480).
; The game writes 3DVideo.CFG itself (DirectX7, this resolution, 32 bit); 3D Setup is not needed.
Mode=borderless
; Resolution for fullscreen and window (missing or 0 = the Windows desktop resolution).
ScreenWidth=0
ScreenHeight=0
; 1 = the 2D screen (menus, HUD, windows) is uploaded as one texture (default).
;     The original cuts it into 128x128 tiles; stretched to a big monitor, thin lines
;     show at the tile joins every 128 pixels.
; 0 = as the original (128x128 tiles).
SingleTexture2D=1

; Frame-rate limit (default 60; also in the game: Options - Video, page 3, 30 / 60 / 120 or
; Unlimited). The 2001 engine moves the party a step per frame: the higher the rate, the
; harder tall ledges and stairs are to climb (the Umpani camp doors), and at hundreds of
; frames the party gets stuck on slopes. 60 is what a good PC of 2001 gave.
; 0 = no limit (not recommended); values below 30 count as 30.
MaxFps=60

; View distance: multiplier of each level's draw distance (the fog moves out with it).
; 1.0 = as the original, maximum 2.0. Monster sight and combat distances do not change.
; Above 1.5 monsters may appear in a light haze.
ViewDistance=1.5

[Experimental]
; Experimental features: off by default, may change or be removed in a later version.
; Also in the game: Options - Experimental (the 5th button, or the USB drive in the computer picture).
; 1 = the main menu background is a looped animation (Data\WIDE\MENU_ANIM.AVI); applies the
;     next time the main menu opens.
AnimatedMenu=0
; 1 = map (Tab): the mouse wheel zooms towards the pointer, dragging with the left button
;     moves the map, a double click zooms in as the original's single click did; a single
;     click does nothing (on the party marker it is the original's click); the right click,
;     the keys and the buttons are the original's. Applies at once.
ModernMap=0
; 1 = fixes of the original game's own bugs (now: the silent crash after about 20 loads of
;     Arnika Road, Trynton and a few other places in one session, and the crash when the
;     window is closed with Alt+F4). 0 = exactly as the original. Applies at once.
OriginalFixes=0
; 1 = the game runs the same at any frame rate: the party moves as the original does at
;     30 fps (stairs and the Umpani doorsteps climbed as intended at any frame rate, the
;     picture as smooth as the frame rate), monsters, flickering lights, damage numbers,
;     map scrolling and mouse-look smoothing as at 30 fps, sound fades of their designed
;     length. 0 = exactly as the original. Applies at once.
FrameRateFix=0

[Debug]
; 1 = write the frame rate to wiz8wide.log every 5 seconds ("[Perf] ... fps").
LogFps=0
