; Wizardry 8 Widescreen - loader settings (version.dll).
; Display, view distance and other settings are in wiz8wide.ini and in the game's Options.

[General]
; 1 = patch on, 0 = off (the game runs exactly as the original)
Enabled=1
; 1 = with the Windows option "Use Unicode UTF-8 for worldwide language support" on, names of
;     characters and saves with non-English letters work and are stored as without that option
;     (docs\loader.md in the source has the one rare exception)
Utf8FileNames=1

[Display]
; 1 = sharp picture with Windows scaling 125%/150% (recommended)
DpiAware=1

[Hybrid]
; 1 = widescreen engine (wiz8hy.dll)
Enabled=1

[Debug]
LogWindowCalls=0
; 1 = record how the game closes or crashes (needs Enabled=1); for a report send wiz8ws.log,
;     wiz8hy.log, wiz8wide.log and the Wiz8Logs folder
Diagnostics=0
