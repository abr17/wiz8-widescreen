; Wizardry 8 Widescreen - loader settings (version.dll).
; Display, view distance and other settings are in wiz8wide.ini and in the game's Options.

[General]
; 1 = patch on, 0 = off (the game runs exactly as the original)
Enabled=1

[Display]
; 1 = sharp picture with Windows scaling 125%/150% (recommended)
DpiAware=1

[Hybrid]
; 1 = widescreen engine (wiz8hy.dll)
Enabled=1

[Debug]
LogWindowCalls=0
