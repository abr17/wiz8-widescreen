; Wizardry 8 Widescreen - loader settings (version.dll).
; Display, view distance and other settings are in wiz8wide.ini and in the game's Options.

[General]
; 1 = patch on, 0 = off: the game's own code runs unchanged, but the game still draws through
;     the render driver named in 3DVideo.CFG (the patch's Direct3D 11 driver, at the last
;     resolution the patch set); the game's own 3D Setup chooses another one
Enabled=1
; 1 = with the Windows option "Use Unicode UTF-8 for worldwide language support" on, names of
;     characters and saves with non-English letters work and are stored as without that option
;     (docs\loader.md in the source has the one rare exception)
Utf8FileNames=1

[Display]
; 1 = sharp picture with Windows scaling 125%/150% (recommended)
DpiAware=1

[D3D11]
; 1 = with the srDD_D3D11 render driver, its add-ons get the camera, the moment the opaque
;     world is drawn and the game's water (no effect with the other render drivers)
Extensions=1

[Hybrid]
; 1 = widescreen engine (wiz8hy.dll). 0 is not supported: it does not give the original
;     game (the loader's older hooks then run on the original code). To switch the patch
;     off, use [General] Enabled=0
Enabled=1

[Debug]
; 1 = wiz8ws.log gets a line for every window the game creates (class, title, style, size)
LogWindowCalls=0
; 1 = record how the game closes or crashes (needs Enabled=1); for a report press
;     "Report a problem..." in Wiz8WideSetup.exe: it packs the logs and the Wiz8Logs folder
Diagnostics=0
