# /etc/wsl.conf of the WSL sandbox (linux_bench.ps1 -Show; Docker ignores this file): no
# automatic mounts of the Windows drives and no starting of Windows programs from Linux.
# sandbox.sh mounts only the game, the package and the output folder.
[automount]
enabled = false
mountFsTab = false

[interop]
enabled = false
appendWindowsPath = false
